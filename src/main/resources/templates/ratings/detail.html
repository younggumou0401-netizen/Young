<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rating details')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>Rating Details</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <!-- The title comes from one of the StaffMemberProfile implementations. -->
    <p><strong th:text="${rating.profile.displayTitle()}">Staff title</strong></p>
    <table class="details">
        <tbody>
        <tr><th scope="row">ID</th><td th:text="${rating.id}"></td></tr>
        <tr><th scope="row">Name</th><td th:text="${rating.name}"></td></tr>
        <tr><th scope="row">Email</th><td th:text="${rating.email}"></td></tr>
        <tr><th scope="row">Role</th><td th:text="${rating.roleType.label}"></td></tr>
        <tr><th scope="row">Clarity</th><td th:text="${rating.clarity}"></td></tr>
        <tr><th scope="row">Niceness</th><td th:text="${rating.niceness}"></td></tr>
        <tr><th scope="row">Knowledge</th><td th:text="${rating.knowledgeableScore}"></td></tr>
        <tr><th scope="row">Overall score</th><td><span th:text="${#numbers.formatDecimal(rating.overallScore, 1, 1)}"></span> / 10</td></tr>
        <tr><th scope="row">Comment</th><td class="comment" th:text="${#strings.isEmpty(rating.comment) ? 'No comment.' : rating.comment}"></td></tr>
        <tr><th scope="row">Created (UTC)</th><td th:text="${#temporals.format(rating.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
        <tr><th scope="row">Updated (UTC)</th><td th:text="${#temporals.format(rating.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></td></tr>
        </tbody>
    </table>
    <p>
        <a th:href="@{/ratings/{id}/edit(id=${rating.id})}">Edit this rating</a> |
        <a th:href="@{/ratings/{id}/delete(id=${rating.id})}">Delete rating</a> |
        <a th:href="@{/ratings}">Back to all ratings</a>
    </p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
