services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: staffratings
      POSTGRES_USER: staffratings
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env first}
    volumes:
      - staff-ratings-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffratings -d staffratings"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: staffratings
      DB_USERNAME: staffratings
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env first}
    depends_on:
      db:
        condition: service_healthy
volumes:
  staff-ratings-db:
